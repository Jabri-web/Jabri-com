:root{
  --bg:#0a0a0f;
  --card:#12121c;
  --section:#181825;
  --item:#0f0f1a;
  --hover:#1e1e2e;
  --bd:#2a2a3e;
  --acc:#6ae3ff;
  --acc2:#00ff88;
  --gold:#d4af37;
  --txt:#e8e8f0;
  --dim:#aaa;
  --muted:#666
}

*{
  box-sizing:border-box
}

body{
  margin:0;
  background:var(--bg);
  color:var(--txt);
  font-family:"Cairo","Tajawal",system-ui,sans-serif;
  line-height:1.8
}

a{
  color:inherit
}

button{
  font-family:inherit
}

.skip{
  position:absolute;
  top:-100px;
  right:12px;
  z-index:9999;
  background:var(--acc2);
  color:#000;
  padding:10px 18px;
  border-radius:8px;
  font-weight:700;
  text-decoration:none
}

.skip:focus{
  top:12px
}

.section{
  background:var(--section);
  border-radius:16px;
  padding:20px 25px;
  margin-bottom:25px;
  border-inline-end:4px solid var(--acc)
}

.pill{
  background:var(--item);
  padding:8px 14px;
  border-radius:30px;
  border:1px solid var(--bd);
  transition:.2s
}

.pill:hover{
  border-color:var(--acc);
  background:var(--hover);
  transform:translateY(-1px)
}

.pill a{
  text-decoration:none;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  flex-wrap:wrap;
  text-align:center
}

.url{
  color:var(--muted);
  font-size:.68rem;
  direction:ltr;
  unicode-bidi:embed;
  background:#1a1a2a;
  padding:0 8px;
  border-radius:10px;
  overflow-wrap:anywhere
}

.inline{
  background:var(--item);
  padding:5px 14px;
  border-radius:20px;
  border:1px solid var(--bd)
}

.inline:hover{
  border-color:var(--acc2);
  background:var(--hover)
}

.inline a{
  color:var(--acc);
  text-decoration:none;
  font-size:.9rem
}

.inline a:hover{
  color:var(--acc2);
  text-decoration:underline
}

.new-link{
  background:rgba(0,255,136,.12)!important;
  border-color:rgba(0,255,136,.6)!important;
  position:relative
}

.new-badge{
  position:absolute;
  top:-10px;
  left:-6px;
  font-size:15px
}

.field{
  width:100%;
  background:transparent;
  border:0;
  color:var(--txt);
  font-family:inherit;
  font-size:1rem;
  outline:none;
  padding:6px 8px
}

.btn-gold{
  display:inline-flex;
  align-items:center;
  gap:8px;
  background:linear-gradient(135deg,#d4af37,#f4e5a1);
  color:#0a0a0f;
  padding:12px 24px;
  border-radius:30px;
  text-decoration:none;
  font-weight:700;
  box-shadow:0 4px 16px rgba(212,175,55,.3)
}

.btn-cyan{
  display:inline-flex;
  align-items:center;
  gap:8px;
  background:rgba(106,227,255,.15);
  color:var(--acc);
  padding:12px 24px;
  border-radius:30px;
  text-decoration:none;
  font-weight:700;
  border:1px solid var(--acc)
}

@media(max-width:640px){
  .section{
    padding:16px 18px
  }

  .btn-gold,.btn-cyan{
    width:100%;
    justify-content:center
  }
}

@media(prefers-reduced-motion:reduce){
  *,*:before,*:after{
    animation:none!important;
    transition:none!important;
    scroll-behavior:auto!important
  }
}

@media print{
  body{
    background:#fff!important;
    color:#000!important
  }

  .section{
    background:#f5f5f5!important
  }

  .no-print{
    display:none!important
  }

  a{
    color:#000!important
  }
}

  .sm\:grid-cols-2{

  }

  .sm\:grid-cols-3{
    grid-template-columns: repeat(3, minmax(0, 1fr));

  .sm\:p-6{
    padding: 1.5rem;
  }

    padding-left: 1rem;
    padding-right: 1rem;
  }
}

  .md\:flex{

  }
}

@media (min-width: 1024px){
  .lg\:grid-cols-3{
    grid-template-columns: repeat(3, minmax(0, 1fr));
