  <!-- 10. JavaScript (مدمج ونظيف بدون تكرار) -->

  <script>
    // دالة تبديل اللغة
    window.toggleLang = function() {
      const next = document.documentElement.lang === 'ar' ? 'en' : 'ar';
      document.documentElement.dir = next === 'en' ? 'ltr' : 'rtl';
      document.documentElement.lang = next;
      localStorage.setItem('lang', next);
      
      // تحديث نصوص الأزرار
      document.querySelectorAll('.top-btn.lang, .bottom-btn.lang').forEach(btn => {
        btn.innerHTML = next === 'en' ? '<span class="ar">🇾🇪 عربي</span><span class="en">🇬🇧 EN</span>' : '<span class="ar">🇾🇪 عربي</span><span class="en">🇬🇧 EN</span>';
      });
    };

    // دالة تشغيل الموسيقى
    window.toggleMusic = function() {
      const audio = document.getElementById('oasisMusic');
      if (!audio) return;
      const btn = document.getElementById('musicBottomBtn');
      if (audio.paused) {
        audio.play().catch(() => {});
        btn.textContent = '🔊';
        btn.classList.add('playing');
      } else {
        audio.pause();
        btn.textContent = '🎵';
        btn.classList.remove('playing');
      }
    };

    // دالة المحادثة
    window.toggleChat = function() {
      alert('💬 المحادثة قيد التطوير... قريباً بإذن الله!\n\n📧 للتواصل: jabri62018@gmail.com');
    };

    // دالة فتح وإغلاق القائمة
    window.toggleMenu = function() {
      document.getElementById('sideMenu').classList.toggle('open');
      document.getElementById('menuOverlay').classList.toggle('active');
    };
    window.closeMenu = function() {
      document.getElementById('sideMenu').classList.remove('open');
      document.getElementById('menuOverlay').classList.remove('active');
    };

    // تشغيل الصوت تلقائياً بعد أول تفاعل
    (function() {
      const audio = document.getElementById('oasisMusic');
      if (!audio) return;
      let musicPlayed = false;

      function playMusic() {
        if (musicPlayed) return;
        musicPlayed = true;
        document.removeEventListener('click', playMusic);
        document.removeEventListener('touchstart', playMusic);
        audio.volume = 1;
        audio.play().then(() => {
          const btn = document.getElementById('musicBottomBtn');
          if (btn) { btn.textContent = '🔊'; btn.classList.add('playing'); }
        }).catch(() => { musicPlayed = false; });
      }

      document.addEventListener('click', playMusic);
      document.addEventListener('touchstart', playMusic);
    })();

    // تهيئة اللغة
    document.addEventListener('DOMContentLoaded', function() {
      const savedLang = localStorage.getItem('lang') || 'ar';
      document.documentElement.dir = savedLang === 'en' ? 'ltr' : 'rtl';
      document.documentElement.lang = savedLang;
    });
