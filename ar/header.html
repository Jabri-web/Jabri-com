    <!-- السكربتات السحرية (الموسيقى، العداد، اللغة المتقدمة)        -->
    <!-- ============================================================ -->
    <script>
        (function() {
            const VERSION = '3.0.0';
            if (localStorage.getItem('jabri_version') !== VERSION) {
                localStorage.clear();
                localStorage.setItem('jabri_version', VERSION);
                console.log('🔄 نسخة الساحر ' + VERSION);
            }
        })();

        // --------------------------------------------------------------
        // 1. تشغيل / إيقاف الموسيقى (مع تذكر الحالة)
        // --------------------------------------------------------------
        (function initMusic() {
            const music = document.getElementById('bgMusic');
            const btn = document.getElementById('musicToggleBtn');
            if (!music || !btn) return;
            let isPlaying = false;
            music.volume = 0.3;

            btn.addEventListener('click', function() {
                if (isPlaying) {
                    music.pause();
                    this.innerHTML = '🎵';
                    this.classList.remove('playing');
                    isPlaying = false;
                    localStorage.setItem('jabri_music_state', 'paused');
                } else {
                    music.play().then(() => {
                        this.innerHTML = '🔇';
                        this.classList.add('playing');
                        isPlaying = true;
                        localStorage.setItem('jabri_music_state', 'playing');
                    }).catch(function() {
                        document.addEventListener('click', function playOnClick() {
                            music.play().then(() => {
                                btn.innerHTML = '🔇';
                                btn.classList.add('playing');
                                isPlaying = true;
                                localStorage.setItem('jabri_music_state', 'playing');
                            }).catch(function() {});
                            document.removeEventListener('click', playOnClick);
                        }, { once: true });
                    });
                }
            });

            setTimeout(function() {
                if (localStorage.getItem('jabri_music_state') === 'playing') {
                    music.play().then(() => {
                        btn.innerHTML = '🔇';
                        btn.classList.add('playing');
                        isPlaying = true;
                    }).catch(function() {});
                }
            }, 500);
        })();

        // --------------------------------------------------------------
        // 2. عداد الزوار (متقدم)
        // --------------------------------------------------------------
        (function initCounter() {
            let count = parseInt(localStorage.getItem('jabri_visitor_count') || '0', 10);
            count += 1;
            localStorage.setItem('jabri_visitor_count', count);
            const display = document.getElementById('visitorCount');
            if (display) display.innerText = count.toLocaleString('ar-EG');
        })();

        // --------------------------------------------------------------
        // 3. الساحر الحقيقي: تبديل اللغة مع الانتقال بين / و /en/
        // --------------------------------------------------------------
        (function magicTranslator() {
            const btn = document.getElementById('langBtn');
            const musicLinkText = document.getElementById('musicLinkText');
            const visitorText = document.getElementById('visitorText');
            if (!btn) return;

            // دالة تحديث نصوص الواجهة (بدون تغيير المسار)
            function updateUIText() {
                const isEnglish = window.location.pathname.startsWith('/en/') || window.location.pathname === '/en';
                // تحديث زر اللغة
                btn.textContent = isEnglish ? '🇾🇪 عربي' : '🇬🇧 English';
                // تحديث نص "موسيقى"
                if (musicLinkText) {
                    musicLinkText.innerText = isEnglish ? 'Music' : 'موسيقى';
                }
                // تحديث نص "زوار"
                if (visitorText) {
                    visitorText.innerText = isEnglish ? 'Visitors' : 'زوار';
                }
                // تحديث اتجاه الصفحة ولغتها (بدون إعادة تحميل)
                document.documentElement.lang = isEnglish ? 'en' : 'ar';
                document.documentElement.dir = isEnglish ? 'ltr' : 'rtl';
            }

            // دالة الانتقال بين النسختين (السحر الحقيقي)
            function switchLanguage() {
                const currentPath = window.location.pathname; // مثال: /page7  أو  /en/page7
                const isEnglish = currentPath.startsWith('/en/') || currentPath === '/en';

                let newPath;
                if (isEnglish) {
                    // نزيل /en/ من البداية (نرجع للعربية)
                    newPath = currentPath.replace(/^\/en/, '') || '/';
                } else {
                    // نضيف /en/ في البداية (نروح للإنجليزية)
                    newPath = currentPath === '/' ? '/en/' : `/en${currentPath}`;
                }
                // نحافظ على الـ query string و الـ hash
                const query = window.location.search;
                const hash = window.location.hash;
                window.location.href = newPath + query + hash;
            }

            // ربط الحدث بالزر
            btn.addEventListener('click', switchLanguage);

            // تحديث النصوص عند تحميل الصفحة
            updateUIText();

            // أيضاً حدث popstate عشان لو المستخدم رجع بالأسهم
            window.addEventListener('popstate', updateUIText);

            console.log('🧙‍♂️ الساحر جاهز! زر اللغة ينقل بين / و /en/ بسلاسة');
        })();

        console.log('✅ الهيدر الكامل جاهز - الأزرار في الزاوية اليسرى السفلية');
    </script>
