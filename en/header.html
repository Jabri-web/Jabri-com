        m.content = tag.content;
        head.appendChild(m);
      }

    // 3. Description
    if (!head.querySelector('meta[name="description"]')) {
      var desc = document.createElement('meta');
      desc.name = 'description';

      head.appendChild(desc);
    }

    // 4. Title
    if (!document.title) {
      document.title = 'Heaven Al-Jabri | واحة الجبري — Z(x) & Sindbad Unified Theory';
    }

    // 5. OG + Twitter
    var ogImage = BASE_URL + '/image/Jabri-photo.webp';
    var descContent = (document.querySelector('meta[name="description"]')?.content) ||
                     'Heaven Al-Jabri — Yemeni heritage and mathematics research';
    var titleContent = document.title || 'Heaven Al-Jabri';

    var ogTags = [

      { prop: 'og:type', content: 'article' },

      { prop: 'og:image:alt', content: 'Heaven Al-Jabri — واحة الجبري' },

      { name: 'twitter:title', content: titleContent },
      { name: 'twitter:description', content: descContent },
      { name: 'twitter:image', content: ogImage }

    ogTags.forEach(function(tag) {
      var sel = tag.prop ? 'meta[property="' + tag.prop + '"]' : 'meta[name="' + tag.name + '"]';
      if (!head.querySelector(sel)) {
        var m = document.createElement('meta');
        if (tag.prop) m.setAttribute('property', tag.prop);
        if (tag.name) m.name = tag.name;
        m.content = tag.content;
        head.appendChild(m);
      }

    // 6. Article
    var articleTags = [
      { prop: 'article:publisher', content: 'Heaven Al-Jabri' },
      { prop: 'article:author', content: 'Eng. Abdulla Mohammed Nasser Al-Jabri' }

    // 7. Manifest
    if (!head.querySelector('link[rel="manifest"]')) {
      var manifest = document.createElement('link');
      manifest.rel = 'manifest';
      manifest.href = '/manifest.json?v=' + VERSION;
      head.appendChild(manifest);
    }

    // 8. Canonical
    if (!head.querySelector('link[rel="canonical"]')) {
      var canonical = document.createElement('link');
      canonical.rel = 'canonical';
      canonical.href = location.href.split('?')[0].split('#')[0];
      head.appendChild(canonical);

    var favicons = [

      { rel: 'icon', type: 'image/x-icon', href: '/favicon.ico' }

    favicons.forEach(function(f) {
      var sel = 'link[rel="' + f.rel + '"]' + (f.sizes ? '[sizes="' + f.sizes + '"]' : '');
      if (!head.querySelector(sel)) {
        var link = document.createElement('link');
        link.rel = f.rel;
        if (f.type) link.type = f.type;
        if (f.sizes) link.sizes = f.sizes;
        link.href = f.href;
        head.appendChild(link);

    // 10. hreflang
    var path = location.pathname.replace(/^\/(ar|en)\//, '/');

        link.href = h.href;
        head.appendChild(link);

    // 11. prev/next/up

      '/Page2.html':   { prev: '/Page1.html',  next: '/Page3.html',  up: '/research.html' },

      '/Page11.html':  { prev: '/Page10.html', next: '/Page12.html', up: '/research.html' },
      '/Page12.html':  { prev: '/Page11.html', next: null,           up: '/research.html' }
    };
    var links = pageLinks[location.pathname.replace(/^\/en/, '')];
    if (links) {
      ['prev', 'next', 'up'].forEach(function(rel) {
        if (!links[rel]) return;
        if (!head.querySelector('link[rel="' + rel + '"]')) {
          var link = document.createElement('link');
          link.rel = rel;
          link.href = BASE_URL + '/en' + links[rel];
          head.appendChild(link);
        }
      });
    }

    // 12. Google News
    var now = new Date().toISOString();
    var pageKey = 'jabri_pub_' + location.pathname;
    var publishedTime = localStorage.getItem(pageKey) || now;
    if (!localStorage.getItem(pageKey)) {
      try { localStorage.setItem(pageKey, now); } catch (e) {}
    }

    var newsTags = [
      { name: 'news_keywords', content: 'Heaven Al-Jabri, Yemen heritage, Z(x), Sindbad Theory, Abdulla Al-Jabri' },
      { prop: 'article:publisher', content: BASE_URL },
      { prop: 'article:published_time', content: publishedTime },
      { prop: 'article:modified_time', content: now },
      { prop: 'article:author', content: BASE_URL + '/en/Author-cv.html' }
    ];
    newsTags.forEach(function(tag) {
      var sel = tag.prop ? 'meta[property="' + tag.prop + '"]' : 'meta[name="' + tag.name + '"]';

        var m = document.createElement('meta');
        if (tag.prop) m.setAttribute('property', tag.prop);
        if (tag.name) m.name = tag.name;
        m.content = tag.content;
        head.appendChild(m);
      }
    });

    if (!document.getElementById('jabriSchemaLD')) {

      schema.type = 'application/ld+json';

            "givenName": "Abdulla",
            "familyName": "Al-Jabri",
            "honorificPrefix": "Eng.",
            "gender": "Male",
            "nationality": { "@type": "Country", "name": "Yemen" },
            "birthPlace": { "@type": "Place", "name": "Sana'a, Yemen" },
            "url": BASE_URL + "/en/about.html",
            "image": BASE_URL + "/image/Jabri-photo.webp",
            "identifier": "https://orcid.org/0009-0003-3319-3822",
            "jobTitle": "Researcher, Engineer, and Founder",
            "description": "Yemeni researcher, founder, owner, publisher, editor, designer, developer, and copyright holder of Heaven Al-Jabri website.",
            "knowsAbout": ["Mathematics", "Theoretical Physics", "Riemann Hypothesis", "Sindbad Unified Theory", "Yemeni Heritage", "Software Development", "Artificial Intelligence"],
            "alumniOf": { "@type": "CollegeOrUniversity", "name": "King Fahd University of Petroleum and Minerals (KFUPM)" },
            "sameAs": [
              "https://orcid.org/0009-0003-3319-3822",
              "https://github.com/Jabri-web",
              "https://zenodo.org/records/20513840",
              "https://wikibin.org/articles/abdulla-mohammed-nasser-al-jabri.html",
              "https://en.wikipedia.org/wiki/User:Jabri2026"
            ]
          },
          {
            "@type": "NewsMediaOrganization",
            "@id": BASE_URL + "/#organization",
            "name": "Heaven Al-Jabri",
            "alternateName": ["واحة الجبري", "Jabri Oasis"],
            "legalName": "Heaven Al-Jabri",
            "url": BASE_URL + "/",
            "logo": { "@type": "ImageObject", "url": BASE_URL + "/image/Jabri-photo.webp", "width": 1200, "height": 630 },
            "image": BASE_URL + "/image/Jabri-photo.webp",
            "description": "Heaven Al-Jabri — a scientific and cultural platform for documenting Yemen's ancient heritage and research in mathematics and theoretical physics (Sindbad Unified Theory Z+C+A=1).",
            "foundingDate": "2026",
            "foundingLocation": { "@type": "Place", "name": "Sana'a, Yemen" },
            "founder": { "@id": BASE_URL + "/#jabri" },
            "owner": { "@id": BASE_URL + "/#jabri" },
            "publisher": { "@id": BASE_URL + "/#jabri" },
            "creator": { "@id": BASE_URL + "/#jabri" },
            "author": { "@id": BASE_URL + "/#jabri" },
            "editor": { "@id": BASE_URL + "/#jabri" },
            "copyrightHolder": { "@id": BASE_URL + "/#jabri" },
            "maintainer": { "@id": BASE_URL + "/#jabri" },
            "areaServed": { "@type": "Place", "name": "Worldwide" },
            "sameAs": [
              "https://orcid.org/0009-0003-3319-3822",
              "https://github.com/Jabri-web",
              "https://zenodo.org/records/20513840"
            ]
          },
          {
            "@type": "WebSite",
            "@id": BASE_URL + "/#website",
            "url": BASE_URL + "/",
            "name": "Heaven Al-Jabri",
            "alternateName": ["واحة الجبري", "Jabri Oasis"],
            "inLanguage": "en",
            "publisher": { "@id": BASE_URL + "/#organization" },
            "potentialAction": {
              "@type": "SearchAction",
              "target": BASE_URL + "/search?q={search_term_string}",
              "query-input": "required name=search_term_string"
            }
          },
          {
            "@type": "WebPage",
            "@id": location.href.split('?')[0].split('#')[0] + "#webpage",
            "url": location.href.split('?')[0].split('#')[0],
            "name": document.title,
            "isPartOf": { "@id": BASE_URL + "/#website" },
            "about": { "@id": BASE_URL + "/#organization" },
            "primaryImageOfPage": BASE_URL + "/image/Jabri-photo.webp",
            "inLanguage": "en",
            "publisher": { "@id": BASE_URL + "/#organization" }
          }
        ]
      });
      head.appendChild(schema);
    }

    // 14. Fonts
    if (!head.querySelector('link[href*="fonts.googleapis.com"]')) {
      var pre1 = document.createElement('link');
      pre1.rel = 'preconnect';
      pre1.href = 'https://fonts.googleapis.com';
      head.appendChild(pre1);

      var pre2 = document.createElement('link');
      pre2.rel = 'preconnect';
      pre2.href = 'https://fonts.gstatic.com';
      pre2.crossOrigin = 'anonymous';
      head.appendChild(pre2);
    }
    if (!head.querySelector('link[href*="font-awesome"]')) {
      var fa = document.createElement('link');
      fa.rel = 'stylesheet';
      fa.href = 'https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css';
      head.appendChild(fa);
    }
    if (!head.querySelector('link[href*="Inter"]')) {
      var fonts = document.createElement('link');
      fonts.rel = 'stylesheet';
      fonts.href = 'https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&family=JetBrains+Mono:wght@400;700&display=swap';
      head.appendChild(fonts);
    }

    console.log('✅ [header v4.3-EN] SEO + NewsMediaOrganization + pub_time — ready');
  }

  // 15. NewsArticle
  if (!document.getElementById('jabriNewsArticleLD')) {
    var newsSchema = document.createElement('script');
    newsSchema.id = 'jabriNewsArticleLD';
    newsSchema.type = 'application/ld+json';
    var pageTitle = document.title || 'Heaven Al-Jabri';
    var pageDesc = (document.querySelector('meta[name="description"]')?.content) || 'Heaven Al-Jabri';
    var pubTime = localStorage.getItem('jabri_pub_' + location.pathname) || new Date().toISOString();
    newsSchema.textContent = JSON.stringify({
      "@context": "https://schema.org",
      "@type": "NewsArticle",
      "mainEntityOfPage": { "@type": "WebPage", "@id": location.href.split('?')[0].split('#')[0] },
      "headline": pageTitle,
      "description": pageDesc,
      "datePublished": pubTime,
      "dateModified": new Date().toISOString(),
      "author": { "@id": "https://jabri-com.vercel.app/#jabri" },

      "image": "https://jabri-com.vercel.app/image/Jabri-photo.webp",
      "isAccessibleForFree": true

    document.head.appendChild(newsSchema);
  }

  addMetaTags();
})();
</script>

<script>
(function() {
    'use strict';

    var IS_APK = (location.protocol === 'file:') ||
                 (navigator.userAgent.indexOf('wv') !== -1);

    console.log('%c🌍 [header v4.3-EN] Environment: ' + (IS_APK ? '📱 APK' : '🌐 Web'),
                'color:#ffd700;font-weight:700');

    var loginModal = document.getElementById('loginModal');
    var localLoginForm = document.getElementById('localLoginForm');
    var localUsername = document.getElementById('localUsername');
    var localPassword = document.getElementById('localPassword');
    var logoutBtn = document.getElementById('logoutBtn');
    var loginOptions = document.getElementById('loginOptions');
    var userStatus = document.getElementById('userStatus');
    var userNameText = document.getElementById('userNameText');
    var userRoleText = document.getElementById('userRoleText');
    var loginTitle = document.getElementById('loginTitle');

    function updateLoginUI() {
        var user = (window.WahaAuth && window.WahaAuth.getUser) ? window.WahaAuth.getUser() : null;
        if (user) {
            userStatus.style.display = 'block';
            loginOptions.style.display = 'none';
            logoutBtn.style.display = 'block';
            userNameText.textContent = user.name || 'User';
            userRoleText.textContent = user.role || 'Visitor';
            loginTitle.innerHTML = '👤 Welcome ' + (user.name || 'User');
        } else {
            userStatus.style.display = 'none';
            loginOptions.style.display = 'block';
            logoutBtn.style.display = 'none';
            loginTitle.innerHTML = '🔐 Sign In';
            localLoginForm.classList.remove('active');
        }
    }

    window.openLoginModal = function() {
        loginModal.classList.add('active');
        updateLoginUI();
    };
    window.closeLoginModalFn = function() {
        loginModal.classList.remove('active');
        localLoginForm.classList.remove('active');
    };

    function localLogin() {
        if (!window.WahaAuth) {
            alert('⚠️ Auth system not loaded yet, please try again');
            return;
        }
        var res = window.WahaAuth.loginLocal(localUsername.value, localPassword.value);
        if (res.ok) {
            localUsername.value = '';
            localPassword.value = '';
            updateLoginUI();
            setTimeout(window.closeLoginModalFn, 800);
        } else {
            alert('❌ ' + res.error);
        }
    }

    function logout() {
        if (window.WahaAuth) window.WahaAuth.logout();
        updateLoginUI();
    }

    var loginBtnEl = document.getElementById('loginBtn');
    if (loginBtnEl) loginBtnEl.addEventListener('click', window.openLoginModal);

    if (loginModal) {
        loginModal.addEventListener('click', function(e) {
            if (e.target === loginModal) window.closeLoginModalFn();
        });
    }

    var googleBtn = document.getElementById('googleLoginBtn');
    if (googleBtn) {
        googleBtn.addEventListener('click', function() {
            if (window.WahaAuth) window.WahaAuth.loginGoogle();
            updateLoginUI();
            setTimeout(window.closeLoginModalFn, 1200);
        });
    }

    var localToggle = document.getElementById('localLoginToggle');
    if (localToggle) {
        localToggle.addEventListener('click', function() {
            localLoginForm.classList.toggle('active');
        });
    }

    var localLoginBtn = document.getElementById('localLoginBtn');
    if (localLoginBtn) localLoginBtn.addEventListener('click', localLogin);

    if (logoutBtn) logoutBtn.addEventListener('click', logout);

    window.addEventListener('waha:auth-changed', updateLoginUI);

    window.openSettings = function() {
        document.getElementById('settingsOverlay').classList.add('active');
    };
    window.closeSettings = function() {
        document.getElementById('settingsOverlay').classList.remove('active');
    };
    window.setMode = function(mode) {
        var device = (document.body.className.split(' ').find(function(c){return c.indexOf('device-')===0;}) || 'device-desktop');
        document.body.className = mode + ' ' + device;
        var dayBtn = document.getElementById('dayBtn');
        var nightBtn = document.getElementById('nightBtn');
        if (dayBtn) dayBtn.classList.toggle('active', mode === 'day');
        if (nightBtn) nightBtn.classList.toggle('active', mode === 'night');
        try { localStorage.setItem('theme', mode); } catch(e){}
    };
    window.setDevice = function(device) {
        document.body.className = document.body.className.replace(/device-\w+/, 'device-' + device);
        var desktopBtn = document.getElementById('desktopBtn');
        var phoneBtn = document.getElementById('phoneBtn');
        if (desktopBtn) desktopBtn.classList.toggle('active', device === 'desktop');
        if (phoneBtn) phoneBtn.classList.toggle('active', device === 'phone');
        try { localStorage.setItem('device', device); } catch(e){}
    };

    window.toggleMusic = function() {
        var audio = document.getElementById('bgMusic');
        var btn = document.getElementById('musicBottomBtn');
        if (!audio || !btn) return;
        if (audio.paused) {
            audio.volume = 0.3;
            audio.play().catch(function() {});
            btn.textContent = '🔊';
            btn.classList.add('playing');
        } else {
            audio.pause();
            btn.textContent = '🎵';
            btn.classList.remove('playing');
        }
    };

    window.toggleBgSound = function() {
        var video = document.getElementById('bgVideo');
        var audio = document.getElementById('bgMusic');
        var btn = document.getElementById('soundBtn');
        if (!video || !audio || !btn) return;
        var isPlaying = !video.muted || !audio.paused;

        if (isPlaying) {
            video.muted = true;
            audio.pause();
            btn.innerHTML = '🔊 Play Sound';
        } else {
            video.muted = false;
            video.play().catch(function() {});
            audio.volume = 0.3;
            audio.play().catch(function() {});
            btn.innerHTML = '🔇 Mute';
        }
    };

    window.toggleChat = function() {
        window.open('/publish/publish-auto.html', '_blank');
    };

    window.toggleSideMenu = function() {
        var sm = document.getElementById('sideMenu');
        var mo = document.getElementById('menuOverlay');
        if (sm) sm.classList.toggle('open');
        if (mo) mo.classList.toggle('active');
    };
    window.closeMenu = function() {
        var sm = document.getElementById('sideMenu');
        var mo = document.getElementById('menuOverlay');
        if (sm) sm.classList.remove('open');
        if (mo) mo.classList.remove('active');
    };
    if (!window.toggleMenu) window.toggleMenu = window.toggleSideMenu;

    document.addEventListener('DOMContentLoaded', function() {
        // English version always LTR
        document.documentElement.dir = 'ltr';
        document.documentElement.lang = 'en';

        var savedTheme = localStorage.getItem('theme') || 'night';
        var savedDevice = localStorage.getItem('device') || 'desktop';
        document.body.classList.remove('day', 'night', 'device-desktop', 'device-phone');
        document.body.classList.add(savedTheme, 'device-' + savedDevice);

        var nightBtn = document.getElementById('nightBtn');
        var dayBtn = document.getElementById('dayBtn');
        var desktopBtn = document.getElementById('desktopBtn');
        var phoneBtn = document.getElementById('phoneBtn');
        if (nightBtn) nightBtn.classList.toggle('active', savedTheme === 'night');
        if (dayBtn) dayBtn.classList.toggle('active', savedTheme === 'day');
        if (desktopBtn) desktopBtn.classList.toggle('active', savedDevice === 'desktop');
        if (phoneBtn) phoneBtn.classList.toggle('active', savedDevice === 'phone');

        updateLoginUI();

        document.addEventListener('click', function firstInteraction() {
            var audio = document.getElementById('bgMusic');
            if (audio && audio.paused) {
                audio.volume = 0.3;
                audio.play().catch(function() {});
            }
            document.removeEventListener('click', firstInteraction);
        }, { once: true });
    });
})();
</script>

<script>
    if ('serviceWorker' in navigator &&
        (location.protocol === 'https:' || location.protocol === 'http:')) {
        window.addEventListener('load', function() {
            navigator.serviceWorker.register('/sw.js').then(function(reg) {
                reg.addEventListener('updatefound', function() {
                    var newWorker = reg.installing;
                    newWorker.addEventListener('statechange', function() {
                        if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                            document.getElementById('updatePopup').style.display = 'flex';
                        }
                    });
                });
            }).catch(function(e) {
                console.warn('⚠️ [sw] Registration failed:', e.message);
            });
        });
    } else {
        console.log('⏭️ [sw] Service Worker skipped');
    }

    function closeAndReload() {
        if (navigator.serviceWorker.controller) {
            navigator.serviceWorker.controller.postMessage('SKIP_WAITING');
        }
        document.getElementById('updatePopup').style.display = 'none';
        setTimeout(function() { window.location.reload(); }, 500);
    }
</script>
