:root{
  --bg:#0a1410;
  --card:#0a1a12;
  --line:#1f3a2b;
  --gold:#f4c430;
  --cyan:#6ae3ff;
  --green:#06d6a0;
  --text:#eafff5;
  --muted:#9fc6b3;
  --soft:#12271d;
}

@media (prefers-color-scheme: dark){
  :root{
    --bg:#0a1410;
    --card:#0a1a12;
    --line:#1f3a2b;
    --text:#eafff5;
    --muted:#9fc6b3;
  }
}

*{
  box-sizing:border-box
}

html{
  scroll-behavior:smooth
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:"Tajawal",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  overflow-x:clip
}

a{
  color:inherit
}

button,input,select{
  font:inherit
}

button{
  cursor:pointer
}

canvas{
  width:100%;
  display:block;
  border-radius:14px;
  background:#07120d
}

input[type=range]{
  width:100%;
  accent-color:var(--gold)
}

input[type=number],input[type=text]{
  width:100%;
  background:#07120d;
  border:1px solid var(--line);
  color:var(--text);
  border-radius:10px;
  padding:10px 11px;
  outline:none
}

input:focus{
  border-color:var(--gold)
}

.num{
  font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Consolas,monospace;
  direction:ltr;
  display:inline-block
}

.formula{
  direction:ltr;
  text-align:center;
  font-family:"IBM Plex Mono",ui-monospace,Consolas,monospace
}

.gold{
  color:var(--gold)
}

.cyan{
  color:var(--cyan)
}

.green{
  color:var(--green)
}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:18px
}

.chip{
  border:1px solid var(--line);
  background:var(--soft);
  border-radius:999px;
  padding:6px 10px;
  font-size:13px
}

.btn{
  border:1px solid var(--line);
  background:#12271d;
  border-radius:10px;
  padding:9px 12px;
  color:var(--text);
  font-weight:800
}

.btn:hover{
  border-color:var(--gold)
}

.btn.active{
  background:var(--gold);
  color:#111;
  border-color:var(--gold)
}

.btn.cyanbtn{
  background:#123038;
  border-color:#2c6b7c;
  color:var(--cyan)
}

.btn.greenbtn{
  background:#0d3327;
  border-color:#176c51;
  color:var(--green)
}

.kpi{
  background:#07120d;
  border:1px solid var(--line);
  border-radius:14px;
  padding:12px
}

table{
  width:100%;
  border-collapse:collapse;
  font-size:13px
}

th,td{
  border-bottom:1px solid #183326;
  padding:8px 6px;
  text-align:center;
  white-space:nowrap
}

th{
  color:var(--gold);
  background:#0c2117
}

::-webkit-scrollbar{
  height:8px;
  width:8px
}

::-webkit-scrollbar-thumb{
  background:#254f39;
  border-radius:99px
}

@media (min-width: 768px) {
  .md\:grid-cols-2 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .md\:grid-cols-3 {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .md\:grid-cols-4 {
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }
}

@media (min-width: 1024px) {
  .lg\:grid-cols-\[1\.25fr_\.75fr\] {
    grid-template-columns: 1.25fr .75fr;
  }

  .lg\:grid-cols-\[1\.4fr_\.8fr\] {
    grid-template-columns: 1.4fr .8fr;
  }

  .lg\:grid-cols-\[1\.5fr_\.8fr\] {
    grid-template-columns: 1.5fr .8fr;
  }
}
