  /* 1 */

:root{
  --gold:#f4c430;
  --cyan:#6ae3ff;
  --green:#06d6a0;
  --panel:#0a1a12;
  --panel2:#08140d;
  --border:#1f3a2b;
  --dim:#8aa892;
  --bg:#0a1410;
  --ink:#e8f5e9;
  --red:#e57373;
  --violet:#ba68c8;
  --orange:#ff8a65;
}

@media (prefers-color-scheme: dark){
  :root{
    --gold:#f4c430;
    --cyan:#6ae3ff;
    --green:#06d6a0;
    --panel:#0a1a12;
    --panel2:#08140d;
    --border:#1f3a2b;
    --dim:#8aa892;
    --bg:#0a1410;
    --ink:#e8f5e9;
  }
}

*{
  box-sizing:border-box
}

html{
  scroll-behavior:smooth
}

body{
  margin:0;
  background:radial-gradient(circle at 30% 15%, #12261c 0%, var(--bg) 70%);
  color:var(--ink);
  font-family:'Segoe UI',Tahoma,Arial,sans-serif
}

.mono{
  font-family:'Courier New',monospace;
  direction:ltr;
  display:inline-block
}

.num{
  font-family:'Courier New',monospace;
  direction:ltr
}

.page{
  width:min(980px,100%);
  margin:0 auto;
  padding:18px 12px 40px;
  display:flex;
  flex-direction:column;
  gap:14px
}

.panel{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:12px;
  padding:18px 20px;
  line-height:2;
  font-size:.9rem
}

.panel h3{
  color:var(--gold);
  margin:0 0 10px;
  font-size:1.05rem;
  border-bottom:1px solid var(--border);
  padding-bottom:8px
}

.math{
  direction:ltr;
  text-align:center;
  background:var(--panel2);
  padding:12px;
  border-radius:8px;
  color:var(--gold);
  margin:10px 0;
  font-family:'Courier New',monospace;
  overflow-x:auto;
  font-size:.82rem;
  line-height:1.9;
  white-space:pre-wrap;
  overflow-wrap:anywhere
}

.wrap{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:14px;
  overflow:hidden;
  position:relative
}

.wrap canvas{
  display:block;
  width:100%;
  height:auto
}

.btn{
  background:#1a4d2e;
  color:#e8f5e9;
  border:1px solid #2e6b45;
  padding:9px 16px;
  border-radius:8px;
  cursor:pointer;
  font-family:inherit;
  font-size:.88rem
}

.btn:hover{
  background:#2e6b45
}

.btn.active{
  background:var(--gold);
  color:#0a1a12;
  border-color:var(--gold);
  font-weight:700
}

.btn:focus-visible, input:focus-visible{
  outline:2px solid var(--gold);
  outline-offset:2px
}

.param{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:10px;
  padding:10px 12px
}

.param label{
  color:var(--dim);
  font-size:.75rem;
  display:block;
  margin-bottom:6px
}

.param input{
  width:100%;
  background:#08140d;
  border:1px solid #2e6b45;
  color:#fff;
  border-radius:6px;
  padding:8px;
  font-family:'Courier New',monospace;
  direction:ltr;
  text-align:center
}

.stat{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:10px;
  padding:10px 12px;
  text-align:center;
  min-width:0
}

.stat .lbl{
  color:var(--dim);
  font-size:.7rem;
  display:block;
  margin-bottom:4px
}

.stat .val{
  font-family:'Courier New',monospace;
  font-weight:700;
  font-size:.9rem;
  direction:ltr;
  overflow-wrap:anywhere
}

.table-wrap{
  overflow-x:auto
}

table{
  width:100%;
  border-collapse:collapse;
  font-size:.78rem;
  direction:ltr;
  min-width:560px
}

th{
  background:#132a1d;
  color:var(--gold);
  padding:8px 4px;
  border:1px solid var(--border);
  font-weight:600;
  white-space:nowrap
}

td{
  padding:6px 4px;
  border:1px solid var(--border);
  text-align:center;
  font-family:'Courier New',monospace
}

tr:nth-child(even){
  background:#0d2015
}

tr.peak{
  background:#2a2005!important
}

tr.valley{
  background:#1a0a20!important
}

tr.inflect{
  background:#0a2530!important
}

tr.hovered{
  background:rgba(244,196,48,.22)!important;
  outline:2px solid var(--gold)
}

.tag{
  display:inline-block;
  padding:2px 8px;
  border-radius:10px;
  font-size:.7rem;
  font-family:'Segoe UI',Tahoma;
  line-height:1.6
}

.tag-field{
  background:var(--gold);
  color:#000;
  font-weight:700
}

.tag-val{
  background:var(--green);
  color:#000;
  font-weight:700
}

.tag-trans{
  background:var(--cyan);
  color:#000
}

.tag-warn{
  background:var(--red);
  color:#000;
  font-weight:700
}

.tag-info{
  background:var(--cyan);
  color:#000;
  font-weight:700
}

.caveat{
  background:#1a1208;
  border-right:4px solid var(--gold);
  border-radius:8px;
  padding:14px 18px;
  color:#ffe082;
  font-size:.85rem;
  line-height:1.8
}

.hint{
  position:absolute;
  background:rgba(0,0,0,.88);
  border:1px solid var(--gold);
  border-radius:6px;
  padding:4px 8px;
  font-size:.75rem;
  font-family:'Courier New',monospace;
  color:var(--gold);
  pointer-events:none;
  z-index:10;
  direction:ltr;
  white-space:nowrap;
  transform:translateX(-50%)
}

details{
  border:1px solid var(--border);
  border-radius:8px;
  padding:10px 12px;
  background:var(--panel2)
}

summary{
  cursor:pointer;
  color:var(--gold);
  font-weight:700
}

input[type=range]{
  accent-color:var(--gold)
}

@media (max-width:560px){
  .panel{
    padding:14px 12px
  }

  table{
    min-width:520px
  }
}
