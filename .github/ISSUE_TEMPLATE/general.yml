name: "💬 مناقشة عامة"
description: "افـتح نقاش عن نظرية Z(x) او واحة الجبري"
title: "[Discussion]"
labels: ["discussion"]
body:
    - type: markdown
    attributes:
      value: |
        ### مرحبا بك في **واحة الجبري** 🌴
        استخدم هذا القالب للمناقشات العامة والأسئلة العلمية

    - type: textarea
    id: topic
    attributes:
      label: "موضوع النقاش"
      description: "عن ماذا تريد ان تتحدث؟"
      placeholder: "مثال: برهان جديد لمعادلة Z(x)"
    validations:
      required: true

    - type: textarea
    id: details
    attributes:
      label: "التفاصيل"
      description: "اشرح فكرتك بالتفصيل"
      placeholder: "اكتب هنا..."
    validations:
      required: true

    - type: checkboxes
    id: terms
    attributes:
      label: "الموافقة"
      options:
                - label: "اوافق على معايير واحة الجبري"
          required: true
